<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで等倍表示にするための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>数字パズル｜100パズル・テンパズル</title>
  <link rel="stylesheet" href="style.css">
  <!-- defer：HTMLを読み終わってからスクリプトを実行する -->
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">

    <!-- =====================================================
         トップ画面
         ===================================================== -->
    <section class="screen" id="screen-home">
      <header class="header">
        <h1 class="title">数字パズル</h1>
        <p class="subtitle">数字と ＋−×÷ で答えを作ろう</p>
      </header>

      <!-- 毎日更新の100パズル -->
      <a class="menu-card menu-daily" href="#/daily">
        <span class="menu-badge">毎日更新</span>
        <span class="menu-title">今日の100パズル</span>
        <span class="menu-desc" id="daily-desc">6つの数字で100を作る</span>
      </a>

      <p class="streak" id="streak"></p>

      <!-- いつでも遊べるステージ（テンパズル・100パズル・1000パズル。script.js で作ります） -->
      <h2 class="section-title">ステージ（いつでも遊べる）</h2>
      <div class="set-menu" id="set-menu"></div>
    </section>

    <!-- =====================================================
         ステージ選択画面（3種類共通）
         ===================================================== -->
    <section class="screen" id="screen-stages" hidden>
      <header class="screen-header">
        <a class="back-btn" href="#/">← もどる</a>
        <h2 class="screen-title" id="stages-title"></h2>
      </header>
      <p class="stage-progress" id="stage-progress"></p>
      <div class="stage-grid" id="stage-grid"></div>
    </section>

    <!-- =====================================================
         ゲーム画面（100パズル・テンパズル共通）
         ===================================================== -->
    <section class="screen" id="screen-game" hidden>
      <header class="screen-header">
        <a class="back-btn" id="game-back" href="#/">← もどる</a>
        <h2 class="screen-title" id="game-title"></h2>
      </header>
      <p class="puzzle-info" id="puzzle-info"></p>
      <p class="lead" id="game-lead"></p>

      <!-- 数字カード（script.js で作ります） -->
      <div class="numbers" id="numbers" aria-label="使う数字"></div>

      <!-- 組み立て中の式 -->
      <div class="expression-box" id="expression-box">
        <div class="expression" id="expression"></div>
      </div>

      <!-- 演算子・カッコ・編集ボタン -->
      <div class="keypad">
        <button class="key key-op" data-op="+" aria-label="たす">＋</button>
        <button class="key key-op" data-op="-" aria-label="ひく">−</button>
        <button class="key key-op" data-op="*" aria-label="かける">×</button>
        <button class="key key-op" data-op="/" aria-label="わる">÷</button>
        <button class="key key-paren" data-paren="(" aria-label="カッコ開き">(</button>
        <button class="key key-paren" data-paren=")" aria-label="カッコ閉じ">)</button>
        <button class="key key-sub" id="undo-btn">1つ戻す</button>
        <button class="key key-sub" id="clear-btn">全部消す</button>
      </div>

      <button class="check-btn" id="check-btn">答え合わせ</button>

      <!-- 結果メッセージ（aria-live：読み上げソフトにも変化を伝える） -->
      <p class="message" id="message" aria-live="polite"></p>
      <p class="attempts" id="attempts"></p>

      <!-- ヒントと答え（答えのボタンはヒントを1つ見ると出てくる） -->
      <div class="help-row">
        <button class="help-btn" id="hint-btn">💡 ヒント</button>
        <button class="help-btn help-answer" id="answer-btn" hidden>答えを見る</button>
      </div>
      <ol class="hint-list" id="hint-list"></ol>

      <!-- クリア後に出すボタン（中身は script.js で作ります） -->
      <div class="after-clear" id="after-clear" hidden></div>
    </section>

  </main>

  <!-- 正解したときの紙吹雪を入れる場所 -->
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</body>
</html>
